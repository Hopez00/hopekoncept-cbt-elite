<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JAMB/WAEC CBT - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            display: flex; justify-content: center; align-items: center;
        }
        .card { background: rgba(255, 255, 255, 0.95); padding: 35px; border-radius: 10px; width: 100%; max-width: 380px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #1a237e; font-size: 20px; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 12px; color: #666; margin-bottom: 25px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 11px; background: #1a237e; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0d1b60; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; font-size: 13px; }
        .footer { text-align: center; font-size: 11px; color: #555; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>JAMB/WAEC TUTORIAL CBT</h2>
        <div class="subtitle">Official Examination Sign-In</div>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Registered Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submitBtn">Sign In to Portal</button>
        </form>
        <div id="message"></div>
        <div class="footer">Developed by Hopekoncept and designs</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            const btn = document.getElementById('submitBtn');

            msg.style.color = '#007bff';
            msg.innerText = 'Authenticating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();

                if (res.ok) {
                    msg.style.color = 'green';
                    msg.innerText = 'Login successful! Opening dashboard...';
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 800);
                } else {
                    msg.style.color = 'red';
                    msg.innerText = data.error || 'Login failed.';
                    btn.disabled = false;
                }
            } catch (err) {
                msg.style.color = 'red';
                msg.innerText = 'Server connection error.';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
