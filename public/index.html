<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JAMB/WAEC Tutorial CBT - Welcome</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #fff;
        }
        .card { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            color: #333; 
        }
        .logo { font-size: 20px; font-weight: bold; color: #1a237e; margin-bottom: 5px; }
        .logo span { color: #f2a900; }
        .subtitle { color: #555; font-size: 13px; margin-bottom: 30px; }
        .btn { 
            display: block; 
            width: 100%; 
            padding: 12px; 
            margin: 12px 0; 
            border-radius: 6px; 
            font-size: 15px; 
            text-decoration: none; 
            font-weight: bold; 
            box-sizing: border-box; 
            text-align: center; 
        }
        .btn-login { background: #1a237e; color: white; }
        .btn-signup { background: #28a745; color: white; }
        .btn:hover { opacity: 0.9; }
        .footer { margin-top: 30px; font-size: 12px; color: #ccc; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">JAMB/WAEC <span>TUTORIAL CBT</span></div>
        <div class="subtitle">Official Examination Portal Gateway</div>
        <a href="/login.html" class="btn btn-login">Sign In to Portal</a>
        <a href="/signup.html" class="btn btn-signup">Create New Account (Sign Up)</a>
    </div>
    <div class="footer">Developed by Hopekoncept and designs</div>
</body>
</html>
