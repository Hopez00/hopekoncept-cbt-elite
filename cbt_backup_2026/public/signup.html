<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAEC/JAMB CBT - Signup</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #message { margin-top: 15px; text-align: center; color: green; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>CBT Portal Signup</h2>
        <form id="signupForm">
            <input type="email" id="email" placeholder="Enter your email" required>
            <input type="password" id="password" placeholder="Create password" required>
            <button type="submit">Register & Send Code</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            msg.style.color = '#007bff';
            msg.innerText = 'Sending verification code...';

            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok) {
                msg.style.color = 'green';
                msg.innerText = data.message;
                setTimeout(() => window.location.href = '/verify.html', 2000);
            } else {
                msg.style.color = 'red';
                msg.innerText = data.error;
            }
        });
    </script>
</body>
</html>
